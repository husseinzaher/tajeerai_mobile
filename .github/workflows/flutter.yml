# Mobile CI.
#
# The mobile client is its own git repository (a submodule of the Tajeer AI
# monorepo), so it carries its own pipeline rather than a job in the parent's
# `ci.yml` -- a pull request opened against this repository has to be checkable
# without the monorepo being present.
#
# Every step below is also runnable locally, unchanged: see CONTRIBUTING.md.
name: Mobile CI

on:
  pull_request:
  push:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project is developed against. The Dart
          # SDK constraint in pubspec.yaml (^3.13.1) ships with this release;
          # bumping one without the other is how a CI-only build failure
          # appears.
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generation runs from a clean checkout so a stale committed artifact
      # cannot hide a broken generator. Everything after this point compiles
      # against freshly generated sources.
      #
      # Tokens first: `lib/app/theme/tokens.g.dart` is the design system's
      # foundation, and nothing else compiles without it.
      - name: Generate tokens
        run: dart run tool/build_tokens.dart

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # First, because a layering violation explains failures that would
      # otherwise look like unrelated compile errors.
      - name: Architecture guard
        run: dart run tool/check_architecture.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - name: Check coverage thresholds
        run: dart run tool/check_coverage.dart

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  build:
    name: Build Android
    runs-on: ubuntu-latest
    # Only after the checks pass: a build that compiles but violates the
    # architecture is not a passing build.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate tokens
        run: dart run tool/build_tokens.dart

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Proves the app actually links, which `flutter analyze` does not, and
      # that the committed production configuration is well-formed -- a typo in
      # .env.production fails here rather than in a release build.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=.env.production
