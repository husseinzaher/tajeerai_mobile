# Android release CD for the Tajeer AI mobile client.
#
# Thin workflow: checkout, toolchain setup, secret injection, then the shared
# release runner (`make cd MODE=github`). All release business logic lives in
# scripts/release/android-cd.sh.
name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing GitHub secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "Missing GitHub secret: ANDROID_KEYSTORE_PASSWORD" >&2
            exit 1
          }
          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "Missing GitHub secret: ANDROID_KEY_PASSWORD" >&2
            exit 1
          }
          test -n "$ANDROID_KEY_ALIAS" || {
            echo "Missing GitHub secret: ANDROID_KEY_ALIAS" >&2
            exit 1
          }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/app/key.properties

      - name: Restore Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "Missing GitHub secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          }

          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/play-service-account.json
          test -s android/play-service-account.json

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Run shared Android CD
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: android/play-service-account.json
          GOOGLE_PLAY_TRACK: ${{ vars.GOOGLE_PLAY_TRACK }}
        run: make cd MODE=github

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Cleanup temporary credentials
        if: always()
        run: |
          rm -f \
            android/app/upload-keystore.jks \
            android/app/key.properties \
            android/key.properties \
            android/play-service-account.json
